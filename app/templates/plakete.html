{% extends "base.html" %}
{% block title %}Plakete{% endblock %}
{% block body %}
<form action="{{ url_for('main.plakete') }}" method="GET" name="plaketeform">
<table border="0" style="margin-left: auto; margin-right: auto;">
<tr><td style="text-align: right;" class="form">Korisničko ime: </td><td class="form"><input type="text" name="korisnik" value="{{ korisnik }}"/></td></tr>
<tr><td style="text-align: right;" class="form">Imenski prostor: </td><td class="form"><select name="impr">
<option value="clanci"{{ ' selected' if impr != 'svi' }}>glavni</option>
<option value="svi"{{ ' selected' if impr == 'svi' }}>svi</option>
</select></td></tr>
<tr><td style="text-align: right;" class="form">Rod: </td><td class="form"><select name="rod">
<option value="muski"{{ ' selected' if rod != 'zenski' }}>muški</option>
<option value="zenski"{{ ' selected' if rod == 'zenski' }}>ženski</option>
</select></td></tr>
<tr><td style="text-align: right;" class="form">Pismo: </td><td class="form"><select name="pismo">
<option value="cir"{{ ' selected' if pismo != 'lat' }}>ćirilica</option>
<option value="lat"{{ ' selected' if pismo == 'lat' }}>latinica</option>
</select></td></tr>
<tr><td style="text-align: right;" class="form">Izgovor: </td><td class="form"><select name="izgovor">
<option value="ek"{{ ' selected' if izgovor != 'ijek' }}>ekavski</option>
<option value="ijek"{{ ' selected' if izgovor == 'ijek' }}>(i)jekavski</option>
</select></td></tr>
<tr><td class="form"></td><td style="text-align: left;" class="form"><input type="submit" value="Generiši"/></td></tr>
</table>
</form>
<h4 style="text-align: center;">{{ poruka }}</h4>
{% endblock %}
